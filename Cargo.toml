[workspace]
resolver = "2"
members = [
    "crates/server",
    "crates/agent",
    "crates/common",
    "crates/core",
    "crates/migration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/zachary-su/zachary-panel"
authors = ["Zachary Su"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# Web framework
axum = { version = "0.8", features = ["ws"] }
tower = { version = "0.5", features = ["limit", "timeout"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "auth", "timeout", "fs"] }
# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# Auth
jsonwebtoken = "9"
bcrypt = "0.16"
# HTTP client (Agent/Servers)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
# WebSocket client (Agent)
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
# Config
config = { version = "0.14", features = ["yaml", "json"] }
# UUID
uuid = { version = "1", features = ["v4", "serde"] }
# Time
chrono = { version = "0.4", features = ["serde"] }
# Hashing
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
# Base64
base64 = "0.22"
# System info (Agent)
sysinfo = "0.33"
# Error handling
thiserror = "2"
anyhow = "1"
# Random
rand = "0.8"
# Future utilities
futures-util = "0.3"

dotenvy = "0.15"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
